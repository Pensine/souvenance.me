# Template GitHub Actions pour le futur repo du site (ou du repo public).
# À copier dans .github/workflows/ du repo qui contient le site.
# Chaque push sur le site → déploiement (Cloudflare/GitHub Pages) puis ping
# IndexNow : Bing (donc ChatGPT browsing), Seznam, Naver, Yandex réindexent
# sans aucune action manuelle.
#
# Prérequis (une fois) :
#   1. Générer une clé : openssl rand -hex 16
#   2. La mettre en secret repo : INDEXNOW_KEY
#   3. Publier le fichier de vérification : site/<clé>.txt contenant la clé
#      (le step "key file" le génère automatiquement au build)

name: Deploy site + IndexNow
on:
  push:
    paths: ["site/**"]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Key file IndexNow
        run: echo "${{ secrets.INDEXNOW_KEY }}" > site/${{ secrets.INDEXNOW_KEY }}.txt

      # Option A — Cloudflare Pages (recommandé : gratuit, rapide, edge)
      # - name: Deploy to Cloudflare Pages
      #   uses: cloudflare/wrangler-action@v3
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     command: pages deploy site --project-name=pensine

      # Option B — GitHub Pages
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4

      - name: Ping IndexNow (Bing & co)
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "YOUR_DOMAIN",
              "key": "${{ secrets.INDEXNOW_KEY }}",
              "urlList": [
                "https://YOUR_DOMAIN/",
                "https://YOUR_DOMAIN/vs-chatgpt-memory",
                "https://YOUR_DOMAIN/vs-mem0",
                "https://YOUR_DOMAIN/guides/own-your-ai-memory"
              ]
            }'
