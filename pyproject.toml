[project]
name = "pensine"
version = "0.1.0"
description = "Souvenance engine: self-hosted personal memory served to any MCP client (MCP server, deposit API, nightly consolidation)"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",                  # official MCP SDK (MCPServer)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",   # file upload (Pensine)
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "itsdangerous>=2.2",         # temporary signed media links (re-immersion)
    "pyyaml>=6.0",               # executable constitution (governor)
]

[project.optional-dependencies]
# Heavy local components, installed on the VPS only
embeddings = [
    "sentence-transformers>=3.0", # nomic-embed-text-v1.5 (768-d, ~500 MB)
    "einops>=0.7",                # required by nomic's remote code
    # <5.15: nomic's remote code calls get_extended_attention_mask, which was
    # removed afterwards — beyond that, encoding fails and recall loses meaning
    "transformers<5.15",
]
local = [
    "FlagEmbedding>=1.3",        # BGE-M3 (1024-d, ~2 GB)
    "whisperx>=3.1",
    # <4: pyannote 4 requires torchcodec (broken without a GPU/recent ffmpeg) and
    # whisperx rejects it. Diarization stays on 3.x until upstream catches up.
    "pyannote.audio>=3.3.2,<4",  # diarization (phase 2)
    "speechbrain>=1.0",          # ECAPA-TDNN voiceprints (phase 2)
    "docling>=2.0",              # PDF -> structured
    "Pillow>=10.0",              # EXIF photos
]
# Lightweight transcription, without torch (PENSINE_TRANSCRIBE_BACKEND=faster-whisper)
transcription = [
    "faster-whisper>=1.1",
    # <17: with PyAV 19, faster-whisper 1.2.1 crashes when opening the file
    # (open() got an unexpected keyword argument 'metadata_errors')
    "av<17",
]
# Transcription on the GPU of Apple Silicon Macs (PENSINE_TRANSCRIBE_BACKEND=mlx-whisper)
transcription-mac = ["mlx-whisper>=0.4"]
# API backend (without a Max/Pro subscription: PENSINE_LLM_BACKEND=api)
api = ["anthropic>=0.40"]
# Real erasure by key destruction (PENSINE_SHRED=1, pensine/shred.py)
shred = ["cryptography>=42"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
# souvenance setup (setup wizard) · souvenance check (AI trial run)
souvenance = "pensine.setup_wizard:main"

[tool.setuptools]
# Flat layout: only these packages are part of the distribution
# (db/, deploy/, consolidation/, persona/ are project content, not installable code)
packages = ["pensine", "pensine.percepteurs", "pensine.widgets"]

[tool.setuptools.package-data]
# the MCP Apps cards: pages, shared style and bundled browser module
"pensine.widgets" = ["*.html", "*.css", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
