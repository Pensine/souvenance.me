[project]
name = "pensine"
version = "0.1.0"
description = "JUMEAU — mémoire vivante auto-hébergée, interrogée via Claude (serveur MCP + dépôt Pensine + consolidation)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",                  # SDK MCP officiel (MCPServer)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",   # upload de fichiers (Pensine)
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "itsdangerous>=2.2",         # liens médias signés temporaires (replongée)
    "pyyaml>=6.0",               # constitution exécutable (gouverneur)
]

[project.optional-dependencies]
# Briques locales lourdes, installées sur le VPS uniquement
embeddings = [
    "sentence-transformers>=3.0", # nomic-embed-text-v1.5 (768-d, ~500 Mo)
    "einops>=0.7",                # requis par le code distant de nomic
]
local = [
    "FlagEmbedding>=1.3",        # BGE-M3 (1024-d, ~2 Go)
    "whisperx>=3.1",
    # <4 : pyannote 4 exige torchcodec (cassé sans GPU/ffmpeg récent) et
    # whisperx la refuse. La diarisation reste en 3.x jusqu'à alignement amont.
    "pyannote.audio>=3.3.2,<4",  # diarisation (phase 2)
    "speechbrain>=1.0",          # empreintes ECAPA-TDNN (phase 2)
    "docling>=2.0",              # PDF -> structuré
    "Pillow>=10.0",              # EXIF photos
]
# Backend API (si pas d'abonnement Max/Pro : PENSINE_LLM_BACKEND=api)
api = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
# Flat-layout : seuls ces packages font partie de la distribution
# (db/, deploy/, consolidation/, persona/ sont du contenu projet, pas du code installable)
packages = ["pensine", "pensine.percepteurs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
